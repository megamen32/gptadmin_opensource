name: GPTAdmin Hub Standby
version: "1.0.19"
slug: gptadmin_hub_standby
description: "GPTAdmin Hub with an optional unified HAOS Node and automatic failover"
url: "https://github.com/megamen32/gptadmin-haos-addons"
arch:
  - aarch64
image: ghcr.io/megamen32/gptadmin-haos-addons
startup: services
boot: auto
init: false
host_network: true
full_access: true
protected: true
apparmor: false
homeassistant_api: true
hassio_api: true
hassio_role: admin
auth_api: true
docker_api: true
privileged:
  - SYS_ADMIN
  - NET_ADMIN
map:
  - config:rw
  - ssl:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw
options:
  node_mode: "legacy"
  quorum_enabled: false
  hub_host: "0.0.0.0"
  hub_port: 9001
  public_origin:
  admin_password:
  failover_frp_token:
  failover:
    primary_health_url:
    primary_public_url:
    node_id: "shell:haos"
    rank: 1
    fail_count_base: 3
    local_hub_port: 9001
    endpoints: []
    proxy_url: ""
    subdomain:
    domain:
    public_confirm_timeout_sec: 3
    maintenance_until: ""
schema:
  node_mode: str
  quorum_enabled: bool
  hub_host: str
  hub_port: int
  public_origin: url
  admin_password: password
  failover_frp_token: password
  failover:
    primary_health_url: url
    primary_public_url: url
    node_id: str
    rank: int
    fail_count_base: int
    local_hub_port: int
    endpoints:
      - str
    proxy_url: str?
    subdomain: str
    domain: str
    public_confirm_timeout_sec: int
    maintenance_until: str?
