# Server-100 installed live consumer budget, measured15October2026.
# Fresh measurements and admission limits: docs/GPTADMIN_RUNTIME_BUDGET.md.
# Lazy task cache is60seconds; prior real history canary stayed below300MiB.
# Human explicitly retains6GiB high /10GiB emergency for this critical service.
# Fresh host reserve and measured consumer acceptance are still required.
