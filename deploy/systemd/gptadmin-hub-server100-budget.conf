# Server-100 controlled consumer-canary candidate; source only until Root applies.
# Fresh measurements and admission limits: docs/GPTADMIN_RUNTIME_BUDGET.md.
# Hard10GiB preserves headroom above observed historical8.23GiB peak.
# Fresh host reserve and measured consumer acceptance are still required.
# Preserve existing EnvironmentFile/auth, executable and service identity.
[Service]
MemoryHigh=3G
MemoryMax=10G
MemorySwapMax=0
CPUQuota=200%
TasksMax=512
IOWeight=50
IOReadBandwidthMax=/dev/nvme0n1 40M
IOWriteBandwidthMax=/dev/nvme0n1 20M
Environment=GOMAXPROCS=2
Environment=GOMEMLIMIT=2GiB
LimitFSIZE=2G
