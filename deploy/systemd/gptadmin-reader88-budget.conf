[Service]
# Two enrolled readers, each with its existing profile and queue.
# Measured pre-update: 35-38 MiB and 39-40 tasks per process.
# The cgroup also holds the enrolled MCP reader itself (codex app-server
# ~150-170 MiB RSS) and, since the profile-scoped Chrome bridge MCP
# (origin/main e1a25541), several Chrome processes (~100-250 MiB RSS each),
# so the budget must cover the whole unit. With MemoryHigh=128M the unit went
# over the soft limit, the kernel reclaimed under the Go runtime, its threads
# parked in D on mem_cgroup_handle_over_high and the peer endpoints stopped
# answering HTTP (curl 28) although TCP was still accepted.
# Fleet incident inc_328f10cc837045a483589e03f11ca681.
# The same budget of 768M/1536M was exhausted again by the grown reader fleet
# (~850 MiB working set): the Node threads parked in D on
# mem_cgroup_handle_over_high, /healthz answered only after ~4s and / never
# answered, so quorum88-node.bezrabotnyi.com failed with curl 28 on every
# route. Fleet incident inc_5c970f384c434be694086fee29c66087.
MemoryHigh=3072M
MemoryMax=6144M
MemorySwapMax=0
CPUQuota=100%
TasksMax=1024
IOWeight=10
Environment=GOMAXPROCS=1
TimeoutStartSec=30s
TimeoutStopSec=15s
