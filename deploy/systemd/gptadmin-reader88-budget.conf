[Service]
# Two enrolled readers, each with its existing profile and queue.
# Measured pre-update: 35-38 MiB and 39-40 tasks per process.
# The cgroup also holds the enrolled MCP reader itself (codex app-server
# ~150-170 MiB RSS), so the budget must cover the whole unit. With
# MemoryHigh=128M the unit went over the soft limit, the kernel reclaimed
# under the Go runtime, its threads parked in D on mem_cgroup_handle_over_high
# and the peer endpoints stopped answering HTTP (curl 28) although TCP was
# still accepted. Fleet incident inc_328f10cc837045a483589e03f11ca681.
MemoryHigh=768M
MemoryMax=1536M
MemorySwapMax=0
CPUQuota=100%
TasksMax=512
IOWeight=10
Environment=GOMAXPROCS=1
TimeoutStartSec=30s
TimeoutStopSec=15s
