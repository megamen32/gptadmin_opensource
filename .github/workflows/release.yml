name: Public Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify immutable tag identity
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"
          test "$tag" = "v$version"
          test "$(git rev-parse "${GITHUB_SHA}^{commit}")" = "$(git rev-parse "${tag}^{commit}")"

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Test public source
        run: |
          set -euo pipefail
          uv sync
          uv run pytest tests/ -v \
            --ignore=tests/test_admin_ui_build_contract.py \
            --ignore=tests/test_completion_matrix.py \
            --ignore=tests/test_docs_product_contract.py \
            --ignore=tests/test_feedback_loop_contract.py \
            --ignore=tests/test_golden_paths.py \
            --ignore=tests/test_public_mirror.py \
            --ignore=tests/test_release_workflow_contract.py \
            --ignore=tests/test_windows_hub_ci_contract.py
          (cd go-hub && go test ./...)
          (cd go-shellmcp && go test ./...)
          (cd go-proxyrelay && go test ./...)
          (cd admin-ui && npm ci && npm test && npm run lint && npm run build -- --base=/admin/)

      - name: Build and verify public artifacts
        run: |
          set -euo pipefail
          TAGGED_RELEASE=1 RELEASE_TAG="$GITHUB_REF_NAME" RELEASE_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")" ./tools/build.sh
          uv run python tools/verify_release_manifest.py verify --root "$GITHUB_WORKSPACE" --manifest "$GITHUB_WORKSPACE/build/manifest.json"
          test -s build/gptadmin-sbom.spdx.json

      - name: Attest public release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            build/*.tar.gz
            build/*.zip
            build/manifest.json
            build/gptadmin-sbom.spdx.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes build/*.tar.gz build/*.zip build/manifest.json build/gptadmin-sbom.spdx.json
