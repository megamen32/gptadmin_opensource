name: Managed peer focused units
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-peer-focused-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.2
          cache: false
      - name: Selected pure units within finite native limits
        shell: bash
        run: |
          set -euo pipefail
          area="$RUNNER_TEMP/gptadmin-focused"
          disk="$RUNNER_TEMP/gptadmin-focused.ext4"
          # Existing public cloud envelope: finite 14GiB disk. Server100's
          # independent 512MiB temp profile is unchanged, never bypassed.
          truncate -s 14G "$disk"
          mkfs.ext4 -q -m 0 "$disk"
          mkdir -p "$area"
          sudo mount -o loop "$disk" "$area"
          trap 'sudo umount "$area"; rm -f "$disk"' EXIT
          sudo chown "$(id -u):$(id -g)" "$area"
          mkdir -p "$area/cache" "$area/modules" "$area/tmp"
          go_binary="$(command -v go)"
          sudo systemd-run --quiet --pipe --wait --collect --uid="$(id -u)" \
            --property=CPUQuota=100% --property=MemoryHigh=512M --property=MemoryMax=1G \
            --property=MemorySwapMax=0 --property=TasksMax=128 --property=IOWeight=10 \
            --property="WorkingDirectory=$GITHUB_WORKSPACE/go-hub" \
            /usr/bin/env GOMAXPROCS=1 GOMEMLIMIT=384MiB GOTOOLCHAIN=local CGO_ENABLED=0 \
            GOCACHE="$area/cache" GOMODCACHE="$area/modules" GOTMPDIR="$area/tmp" TMPDIR="$area/tmp" \
            /usr/bin/timeout --signal=TERM --kill-after=5s 150s \
            /bin/bash -c 'set -euo pipefail
              cd "$2/go-hub"
              "$1" test -json -p 1 -parallel 1 -count=1 -mod=readonly -timeout=35s \
                -run "^(TestManagedNode|TestConnection|TestChildScope|TestTaskControlsPrune|TestTaskReadSnapshotWhileWriterHeld|TestShellQueueEnvelope|TestTaskDispatchRequeuesFailedCommit)" ./internal/hub | tee "$3/selected-hub.jsonl"
              cd "$2/go-shellmcp"
              "$1" test -json -p 1 -parallel 1 -count=1 -mod=readonly -timeout=20s \
                -run "^(TestAgentMemoryREST|TestScoped)" ./internal/mcpclient | tee "$3/selected-memory.jsonl"
              "$1" test -json -p 1 -parallel 1 -count=1 -mod=readonly -timeout=20s \
                -run "^(TestQueueResponse)" ./internal/hub | tee "$3/selected-queue-reader.jsonl"
            ' -- "$go_binary" "$GITHUB_WORKSPACE" "$area"
          python3 - "$area/selected-hub.jsonl" "$area/selected-memory.jsonl" "$area/selected-queue-reader.jsonl" <<'PY'
          import json,sys
          events=[json.loads(line) for path in sys.argv[1:] for line in open(path) if line.startswith('{')]
          passes=[e['Test'] for e in events if e.get('Action')=='pass' and e.get('Test')]
          assert sum(e.get('Action')=='pass' and not e.get('Test') for e in events)==3
          for expected in ['TestManagedNodeConnectionPath','TestManagedNodeConnectionRefusesLegacyAndBusyPeers','TestManagedNodeConnectionRefusesForeignProfileAndSecondHop','TestManagedNodeConnectionPreservesOwnerSessionAndNoContent','TestManagedNodeLocalExecuteMethodAndHeaders','TestConnectionOwnerRejectsOtherWideAndUnboundProfiles','TestConnectionOwnerParentShellCannotBypassPrivateRef','TestConnectionOwnerLegacyAndDisabledSemantics','TestConnectionProbeReturnsLegacyVerdictWithoutSession','TestConnectionProbeDoesNotForwardToBusyPeer','TestConnectionProbeKeepsOwnerAndRoutingFences','TestShellQueueEnvelopeLegacyRefusesBeforeLease','TestShellQueueEnvelopeEncodingFailureBeforeLease','TestShellQueueEnvelopeBounds','TestTaskDispatchRequeuesFailedCommit','TestQueueResponseReadsLargeEnvelope','TestQueueResponseRejectsOverflowAndReadFailure','TestQueueResponseClosesOriginalBody','TestTaskControlsPruneUsesCoveringDoneIndex','TestTaskControlsPrunePreservesActiveRecentAndBoundaryRecords','TestTaskReadSnapshotWhileWriterHeld','TestAgentMemoryRESTPreservesScopeAndCallerArgs','TestAgentMemoryRESTBoundsListsAndAuditWithoutFallback','TestAgentMemoryRESTRefusesRedirectAndNoSecretErrors','TestAgentMemoryRESTSchemaAndFailureAreTruthful','TestAgentMemoryRESTGenericBackendErrorRemainsError','TestScopedHTTPNamespaceSupportsBoundedMultiServerStartup','TestScopedHTTPBusyRefusesBeforePartitionAndPayload']:
              assert expected in passes, expected
          print(json.dumps({'selected_passes':len(passes),'runtime_acceptance':False}))
          PY
