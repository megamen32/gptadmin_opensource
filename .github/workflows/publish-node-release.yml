name: Publish verified Node release

on:
  workflow_run:
    workflows: ['Public Product CI']
    types: [completed]

concurrency:
  group: gptadmin-public-node-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-test-publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Checkout the exact source that passed all public product gates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require that the tested source is still public main
        id: current
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an unpublished Node version
        id: scope
        if: steps.current.outputs.current == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+$ ]]; then
            echo "VERSION '$version' is not a plain integer" >&2
            exit 1
          fi
          prefix="node-v${version}-"
          release_tags="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          published=false
          while IFS= read -r tag; do
            if [[ "$tag" == "${prefix}"* ]]; then
              published=true
              break
            fi
          done <<< "$release_tags"

          paths="$(git diff-tree --no-commit-id --name-only -r "$SOURCE_SHA")"
          source_changed=false
          while IFS= read -r path; do
            case "$path" in
              VERSION|cli.py|go-hub/*|go-shellmcp/*|scripts/gptadmin_node_*.py|tools/build_node.py)
                source_changed=true
                break
                ;;
            esac
          done <<< "$paths"

          if [[ "$published" == 'true' && "$source_changed" == 'true' ]]; then
            echo "Node package source changed after version $version was released; bump VERSION." >&2
            exit 1
          fi
          changed=false
          if [[ "$published" == 'false' || "$source_changed" == 'true' ]]; then
            changed=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Download exact Node packages tested by Public Product CI
        if: steps.current.outputs.current == 'true' && steps.scope.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gptadmin-node-*-*-${{ github.event.workflow_run.head_sha }}
          path: .tmp/node-packages
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify complete package set against the tested source
        if: steps.current.outputs.current == 'true' && steps.scope.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.publish_node_release import verify_package
          directory = Path('.tmp/node-packages')
          expected = set()
          for platform in ('linux', 'darwin'):
              for arch in ('amd64', 'arm64'):
                  name = f'gptadmin-node-{platform}-{arch}.tar.gz'
                  expected.update((name, name + '.sha256'))
                  manifest = verify_package(directory / name, arch, os.environ['SOURCE_SHA'], platform)
                  if manifest['build_version'] != int(Path('VERSION').read_text().strip()):
                      raise SystemExit('CI package version differs from the tested source')
          if {p.name for p in directory.iterdir()} != expected:
              raise SystemExit('CI artifacts must contain exactly four packages and their checksums')
          PY

      - name: Preflight the Darwin archives with the publisher and macOS installer
        if: steps.current.outputs.current == 'true' && steps.scope.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tags="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^node-v[1-9][0-9]*-[0-9a-f]{12}$"))')"
          previous="$(sort -V <<< "$tags" | tail -n 1)"
          args=()
          if [[ -n "$previous" ]]; then
            [[ "$previous" =~ ^node-v[1-9][0-9]*-([0-9a-f]{12})$ ]]
            commit="$(git rev-parse "refs/tags/$previous^{commit}")"
            [[ "$commit" == "${BASH_REMATCH[1]}"* ]]
            prior="$RUNNER_TEMP/gptadmin-previous-macos-installer.py"
            git show "$commit:scripts/gptadmin_node_macos_manage.py" > "$prior"
            args+=(--previous-installer "$prior")
          fi
          python3 tests/e2e/node/darwin_package.py .tmp/node-packages "$SOURCE_SHA" "${args[@]}"

      - name: Publish immutable Node release for this public source commit
        if: steps.current.outputs.current == 'true' && steps.scope.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 tools/publish_node_release.py
          --directory .tmp/node-packages
          --source "$SOURCE_SHA"
          --repository megamen32/gptadmin_opensource
